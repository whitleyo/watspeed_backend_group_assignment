<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Franchise Profit Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            font-size: 1.2em;
            color: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Franchise Profit Calculator</h1>
        <form id="calculator-form">
            <label for="nCustomers">Number of customers per day:</label>
            <input type="number" id="nCustomers" name="nCustomers" placeholder="Enter number of customers" required>

            <label for="size">Store size (in square feet):</label>
            <input type="number" id="size" name="size" placeholder="Enter store size in square feet" required>

            <label for="cost">Rental cost per square foot per year:</label>
            <input type="number" id="cost" name="cost" placeholder="Enter rental cost per square foot" required>

            <button type="button" onclick="calculateProfit()">Calculate Profit</button>
        </form>
        <div class="result" id="result"></div>
    </div>

    <script>
        function calculateProfit() {
            // Get input values
            const nCustomers = parseFloat(document.getElementById('nCustomers').value);
            const size = parseFloat(document.getElementById('size').value);
            const cost = parseFloat(document.getElementById('cost').value);

            // Validate inputs
            if (isNaN(nCustomers) || isNaN(size) || isNaN(cost)) {
                document.getElementById('result').textContent = "Please enter valid numbers for all fields.";
                return;
            }

            // Constants
            const averageSpending = 5;
            const overheadMultiplier = 2;

            // Calculate profit
            const profit = (nCustomers * 4 * 365 * averageSpending) - (size * overheadMultiplier * cost);

            // Display result
            document.getElementById('result').textContent = `Estimated Annual Profit: $${profit.toFixed(2)}`;
        }
    </script>
</body>
</html>

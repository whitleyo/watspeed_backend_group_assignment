openapi: 3.0.0
info:
  title: Coffee Reservation & Ordering API
  version: 1.0.0
  description: API for handling coffee orders and reservations.

paths:
  /register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Invalid request
  
  /sign-in:
    post:
      summary: Sign in an existing user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Sign in successful
        '401':
          description: Unauthorized
  
  /sign-out:
    post:
      summary: Sign out the current user
      responses:
        '200':
          description: Sign out successful
  
  /menu:
    get:
      summary: Retrieve the coffee menu
      responses:
        '200':
          description: Menu retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    price:
                      type: number
  
  /order:
    post:
      summary: Place a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      quantity:
                        type: integer
      responses:
        '201':
          description: Order placed successfully
        '400':
          description: Invalid request
  
  /order/modify/{order-id}:
    put:
      summary: Modify an existing order
      parameters:
        - name: order-id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      quantity:
                        type: integer
      responses:
        '200':
          description: Order modified successfully
        '404':
          description: Order not found

  /order/cancel/{order-id}:
    delete:
      summary: Cancel an existing order
      parameters:
        - name: order-id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order canceled successfully
        '404':
          description: Order not found

  /reservations/reserve-seat/{seat-id}:
    post:
      summary: Reserve a seat
      parameters:
        - name: seat-id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Seat reserved successfully
        '404':
          description: Seat not available

  /reservations/cancel-seat/{seat-id}:
    delete:
      summary: Cancel a seat reservation
      parameters:
        - name: seat-id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Reservation canceled successfully
        '404':
          description: Reservation not found